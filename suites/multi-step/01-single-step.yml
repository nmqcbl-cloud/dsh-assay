name: "M1 单步基线：一句话解释概念"
#
# 观测用套件，**不是**接受门。第五阶段（接受门）之前不要拿它下结论。
#
# 场景：单步。预期 1 步 —— 模型不需要工具，直接作答。
# 它的作用只有一个：当其余四个套件的对照组。如果它跑出 >1 步，说明环境有问题，
# 不是模型在思考。
#
# 后端：baseline = deepseek-v4-pro，candidate = deepseek-flash。
# （观测轮两列都是 v4-pro，那是为了验证套件本身；本轮起改为真正的双后端对比。）

budgetCNY: 2
timeoutSec: 300

# 烟雾测试（环境探针）：不参与迁移判定。见 src/verdict.ts 的 GateResult.smokeTest。
smokeTest: true

# ── 判定层输入 ────────────────────────────────────────────────────────────
# 成本门采信**跨批区间**而不是本次单跑的点值：单次跑给不出区间，而成本是唯一
# 能跨批使用的指标（三批次 15/15 判定一致）。数据来源 docs/backend-comparison.md 第八节。
historicalCost:
  baselineRangeUSD: [0.000368, 0.001342]
  candidateRangeUSD: [0.00008, 0.0001]
  savingsPercent: 78.1
  batches: 3
  samples: 9
backends:
  baseline:
    id: deepseek-v4-pro
    displayName: DeepSeek V4 Pro
    baseUrl: https://api.deepseek.com/anthropic
    model: deepseek-v4-pro
    apiKeyEnv: DEEPSEEK_API_KEY
  candidate:
    id: deepseek-flash
    displayName: DeepSeek Flash
    baseUrl: https://api.deepseek.com/anthropic
    model: deepseek-flash
    apiKeyEnv: DEEPSEEK_API_KEY

steps:
  - prompt: "用一句话解释什么是 Agent Harness"
    assert:
      - type: output_contains
        text: "Harness"
      # 观测期的护栏，不是判据：只防死循环烧钱。真阈值等观测数据出来再定。
      - type: max_steps
        value: 20
