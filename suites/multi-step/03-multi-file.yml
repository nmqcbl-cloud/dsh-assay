name: "M3 多步场景：读多个文件 + 定位 bug + 修复 + 验证"
#
# 观测用套件。预期 5-15 步。
#
# 三个文件里只有 format.mjs 有 bug（Math.min 写成了该用的 Math.max），
# main.mjs 是自检入口，math.mjs 是无辜文件。要跑出多步，agent 必须真的去读、
# 去定位，而不是看到 FAIL 就瞎改。

budgetCNY: 2
timeoutSec: 300

# 被测 agent 会改动这个目录。填了它就会在 baseline 和 candidate 跑完后各拍一份快照，
# 否则"baseline 做对了没有"只能靠步数推断。
workspace: /tmp/dsh-multi-step/multi-file

# ── 判定层输入 ────────────────────────────────────────────────────────────
# 成本门采信**跨批区间**而不是本次单跑的点值：单次跑给不出区间，而成本是唯一
# 能跨批使用的指标（三批次 15/15 判定一致）。数据来源 docs/backend-comparison.md 第八节。
historicalCost:
  baselineRangeUSD: [0.002768, 0.003219]
  candidateRangeUSD: [0.000764, 0.0011]
  savingsPercent: 73.2
  batches: 3
  samples: 9
backends:
  baseline:
    id: deepseek-v4-pro
    displayName: DeepSeek V4 Pro
    baseUrl: https://api.deepseek.com/anthropic
    model: deepseek-v4-pro
    apiKeyEnv: DEEPSEEK_API_KEY
  candidate:
    id: deepseek-flash
    displayName: DeepSeek Flash
    baseUrl: https://api.deepseek.com/anthropic
    model: deepseek-flash
    apiKeyEnv: DEEPSEEK_API_KEY

steps:
  - prompt: |
      先用 node 运行这个脚本重置工作区（用 bash）：
      node {suiteRoot}/suites/multi-step/fixtures/reset-all.mjs multi-file

      工作区在 /tmp/dsh-multi-step/multi-file/。现在运行
      node /tmp/dsh-multi-step/multi-file/main.mjs —— 它会失败。

      请读这个目录下的源文件，定位真正的 bug（注意：不是每个文件都有问题），
      修好它，再运行 main.mjs 确认输出 PASS。

      最后用一句话报告：bug 在哪个文件的哪一行、为什么会导致失败。
    assert:
      # 第一条是**真正的判据**：修好 format.mjs 之后，这行描述文本必须一字不差。
      # 断言的是"最高 30"而不是"PASS"，因为 PASS 是 main.mjs 自己算出来的 ——
      # 只查 PASS 的话，一个把 main.mjs 改坏的模型仍可能过。查描述文本还挡得住
      # "改 main.mjs 的期望值来骗过自检"这种作弊（那样会变成"最高 10"）。
      - type: command_output_contains
        command: ["node", "main.mjs"]
        text: "平均 20.00，最高 30"
      # 第二条兜底：main.mjs 的自检本身也要通过（它失败时会 exit 1 并打印 FAIL）。
      - type: command_output_contains
        command: ["node", "main.mjs"]
        text: "PASS"
      - type: max_steps
        value: 20
